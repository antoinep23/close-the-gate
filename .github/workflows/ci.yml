name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript compile (root)
        run: npx tsc --noEmit

      - name: TypeScript compile (web)
        run: npx tsc --noEmit
        working-directory: web

      - name: Run root tests
        run: npm test

      - name: Run web tests
        run: npm test
        working-directory: web
