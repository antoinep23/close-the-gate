name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js v26
        run: |
          curl -fsSL https://nodejs.org/dist/v26.0.0/node-v26.0.0-linux-x64.tar.xz | tar -xJ --strip-components=1 -C /usr/local
          node --version
          npm --version

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        run: npm install
        working-directory: web

      - name: TypeScript compile (root)
        run: npx tsc --noEmit

      - name: TypeScript compile (web)
        run: npx tsc --noEmit
        working-directory: web

      - name: Run root tests
        run: npm test

      - name: Run web tests
        run: npm test
        working-directory: web
